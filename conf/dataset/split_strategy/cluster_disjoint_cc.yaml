# Split strategy: cluster_disjoint_cc
# 2D-CD CC builder (src/datasets/dataset_pairs_cc.py).
# Inherits the cluster_disjoint knobs; adds the CC-only knobs below.
# NOT accepted by the v2 Stage-3 CLI.

defaults:
  - cluster_disjoint
  - _self_
mode: cluster_disjoint_cc
negative_scope: within_cc          # within_cc (hard, removes cluster shortcut) | within_fold (easier)
m_pos_per_cc: 1                    # positive ROWS kept per CC (atom=CC; m does NOT change the atom count). 1 = uniform-weight atoms; null = no cap
drop_negative_infeasible_ccs: true # drop CCs with no drawable within-CC negative
max_atoms: null                    # null = no cap; int = keep a seeded random subset of atoms (size-controlled sweeps; caps atom_id, composes with cut)
edge_cut:                          # routing-B edge-cut fragmentation (src/datasets/_megacc_cut.fragment_until):
  enabled: false                   #   grow the atom count by bisecting the mega-CC + dropping straddling pairs (default off)
  cut_method: spectral             #   spectral (Fiedler) | kl (Kernighan-Lin)
  target_atoms: null               #   grow toward this many atoms (required when enabled)
  max_drop_frac: 0.02              #   cap on the dropped-pair fraction (best-effort; edge-cut floor-limited)
