# Split strategy: cluster_disjoint_cc
# 2D-CD CC builder (src/datasets/dataset_pairs_cc.py).
# Inherits the cluster_disjoint knobs; adds the CC-only knobs below.
# NOT accepted by the v2 Stage-3 CLI.

defaults:
  - cluster_disjoint
  - _self_
mode: cluster_disjoint_cc
negative_scope: within_cc           # within_cc (hard, removes cluster shortcut) | within_fold (easier)
m_pos_per_cc: null                  # positive ROWS kept per CC (atom=CC; m does NOT change the atom count). 1 = uniform-weight atoms; null = no cap
drop_negative_infeasible_ccs: false # if true,drop CCs with no drawable within-CC negative
max_atoms: null                     # null = no cap; int = keep a seeded random subset of atoms (size-controlled sweeps; caps atom_id, composes with cut)
fold_assignment: groupkfold         # groupkfold (default) | leave_cc_out (each of the k largest CCs = one test fold; OOD)
tail_ccs_to_train: true             # leave_cc_out: keep the non-test (tail) CCs in train (both arms)
paired_random: false                # leave_cc_out: also emit a size-matched random arm reusing the same full set
membership_path: null               # within_cc pool membership override (null = _MEMB set-cover; set to cluster_memb_*_ood for _ood sets)
edge_cut:                           # routing-B edge-cut fragmentation (src/datasets/_megacc_cut.fragment_until):
  enabled: true                     # grow the atom count by bisecting the mega-CC + dropping straddling pairs (default off)
  cut_method: spectral              # spectral (Fiedler) | kl (Kernighan-Lin)
  target_atoms: null                # grow toward this many atoms (required when enabled)
  max_drop_frac: 0.02               # cap on the dropped-pair fraction (best-effort; edge-cut floor-limited)

