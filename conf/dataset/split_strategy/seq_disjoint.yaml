# Split strategy: seq_disjoint
# Keeps each unique sequence in one split only, keyed on EXACT-identity hashes
# (vs cluster_disjoint, which groups by similarity). Mitigates sequence-level leakage.

mode: seq_disjoint
# seq_disjoint-only. Which exact-identity hash family the bigraph is built on:
#   seq = prot_hash     (aa)      stricter — no protein in two splits; right for ESM-2 features
#   dna = ctg_dna_hash  (nt_ctg)  looser — synonymous variants may split; for contig k-mer features
#   cds = cds_dna_hash  (nt_cds)  the seq_disjoint counterpart of the nt_cds alphabet
hash_key: seq
