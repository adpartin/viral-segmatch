# STATUS: experimental -- HA-NA on H3N2 isolates collected in 2025, 4-fold random-split CV.
# One point of the H3N2 single-year sweep; see flu_ha_na_h3n2_2024_random_cv4 for the design notes
# this bundle follows. 2,663 positive pairs from 3,436 isolates (78% survive pair_key dedup).
#
# Random split, not 2D-CD: a cluster-disjoint k-fold needs the heaviest single-side cluster's pair
# mass <= 1/k, and on a single-year H3N2 population one cluster carries almost everything (2024
# HA-NA: 94.6% at t099, max_balanced_k=1). A random split has no such constraint. It measures
# whether the model can match HA-NA segments when it HAS seen the clusters -- not the
# cluster-disjoint question in docs/plans/2026-08-20_h3n2_2dcd_within_cc_plan.md.
#
# `negative_scope: within_fold` uses the same negative primitive as the 2D-CD runs
# (`dataset_pairs_cc.within_fold_negatives`), so scores are comparable to those arms rather than to
# the coverage-first sampler's output. Read the realised within-CC share off
# cc_nt_cds_cm0_h3n2_2025/HA-NA/tXXX/ rather than assuming it.
#
# `training.interaction: concat` is declared rather than left to a CLI override: flu_ha_na sets
# 'unit_diff + prod' for its own k-mer sweep, and every H3N2 result to date was produced with
# concat. Declaring it keeps the run reproducible from the bundle alone (same reasoning as
# flu_ha_na_cc_nt_cds_cm0).
#
# Path: dataset_segment_pairs.py -> v2 generate_all_cv_folds_v2 (KFold over unique isolates, so the
# 4 test sets are disjoint). mode: random is required -- the v2 validator rejects seq_disjoint
# (flu_ha_na's default) with n_folds > 1.
defaults:
  - flu_ha_na
  - _self_

dataset:
  n_folds: 4
  neg_to_pos_ratio: 1.0         # matches the 2D-CD runs
  hn_subtype: [H3N2]
  year: [2025]
  generate_visualizations: false
  split_strategy:
    mode: random
    negative_scope: within_fold
    pair_key_alphabet: nt_cds
    cds_final_path: data/processed/flu/July_2025/cds_dna_final.parquet

kmer:
  alphabet: nt_cds
  k: 6

training:
  interaction: concat
