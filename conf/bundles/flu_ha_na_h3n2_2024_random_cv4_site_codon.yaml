# STATUS: experimental -- per-site codon features on the pinned-length H3N2 2024 folds.
#
# Same dataset as flu_ha_na_h3n2_2024_random_cv4_pinned_length; only the features differ. There is
# one column per codon position, HA 567 + NA 470 = 1,037 columns.
#
# interaction MUST be concat and slot_transform MUST be none. Slot A and slot B are different
# spaces of different lengths, so a difference or a product between them compares positions that
# have nothing to do with each other. The values are category codes, so a normalizer has nothing to
# work on. The feature loader rejects any other setting.
#
# Build the cache first:
#   python src/embeddings/compute_site_features.py \
#       --config_bundle flu_ha_na_h3n2_2024_random_cv4_site_codon --unit codon --proteins HA NA
#
# See docs/plans/2026-08-28_per_site_nt_features_plan.md, "Which unit to use".
defaults:
  - flu_ha_na_h3n2_2024_random_cv4_pinned_length
  - _self_

site:
  unit: codon
  encoding: ordinal

training:
  feature_source: site
  interaction: concat
  slot_transform: none
