# STATUS: experimental -- per-site codon features on the pinned-length H3N2 2024 folds.
#
# Same dataset and the same positions as flu_ha_na_h3n2_2024_random_cv4_site_nt; only the site
# unit differs. codon and aa cover the SAME positions (3 x protein length == CDS length exactly),
# so codon site i and amino-acid site i are the same place and only the value differs. That makes
# the pair a clean question: codon keeps silent changes, aa discards them, so a gap between them
# is what silent variation is worth. HA 567 + NA 470 = 1,037 columns either way.
#
# interaction MUST be concat and slot_transform MUST be none -- see the site_nt bundle.
#
# Build the cache first:
#   python src/embeddings/compute_site_features.py \
#       --config_bundle flu_ha_na_h3n2_2024_random_cv4_site_codon --unit codon --proteins HA NA
#
# See docs/plans/2026-08-28_per_site_nt_features_plan.md, "Which unit to use".
defaults:
  - flu_ha_na_h3n2_2024_random_cv4_pinned_length
  - _self_

site:
  unit: codon
  encoding: ordinal

training:
  feature_source: site
  interaction: concat
  slot_transform: none
