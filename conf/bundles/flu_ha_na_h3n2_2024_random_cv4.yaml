# STATUS: experimental -- HA/NA on H3N2 isolates collected in 2024, 4-fold random-split CV.
#
# Why a random split rather than 2D-CD: on this population a cluster-disjoint k-fold is
# infeasible. One NA cluster carries 94.6% of the positive pairs at t099 and one HA cluster 96.7%
# at t098, so max_balanced_k=1 at both thresholds (cc_nt_cds_cm0_h3n2_2024/HA-NA/tXXX/
# cc_summary.json). An edge cut cannot help -- it partitions CCs, never clusters. A random split
# has no such constraint, so k is free; k=4 here.
#
# This measures a different thing from the 2D-CD runs: train and test share clusters, so the
# cluster shortcut is available. It answers "can the model match H3N2 2024 HA-NA segments when it
# has seen the clusters", not the cluster-disjoint question in
# docs/plans/2026-08-20_h3n2_2dcd_within_cc_plan.md.
#
# `negative_scope: within_fold` uses the same negative primitive as the 2D-CD runs
# (`dataset_pairs_cc.within_fold_negatives`: a random positive's slot-a sequence paired with
# another positive's slot-b sequence, drawn inside each split), so the scores are comparable to
# flu_ha_na_cc_nt_cds_cm0_h3n2's within_fold arm rather than to the coverage-first sampler's
# output. Most of those negatives land inside one CC by composition -- 93.9% at t099, measured on
# the CC artifacts -- because the mega-CC holds 96.8% of the pairs. That is a property of this
# population, not a guarantee: only `negative_scope: within_cc` (CC builder only) makes it 100%.
#
# Path: `dataset_segment_pairs.py` -> v2 `generate_all_cv_folds_v2` (KFold over unique isolates,
# so the 4 test sets are disjoint). `mode: random` is required -- the v2 validator rejects
# seq_disjoint (flu_ha_na's default) with n_folds > 1.
defaults:
  - flu_ha_na
  - _self_

dataset:
  n_folds: 4
  neg_to_pos_ratio: 1.0         # matches the 2D-CD runs
  hn_subtype: [H3N2]
  year: [2024]
  generate_visualizations: false
  split_strategy:
    mode: random
    negative_scope: within_fold
    pair_key_alphabet: nt_cds
    cds_final_path: data/processed/flu/July_2025/cds_dna_final.parquet

kmer:
  alphabet: nt_cds
  k: 6

training:
  # Declared rather than left to a CLI override: flu_ha_na sets 'unit_diff + prod' for its own
  # k-mer sweep, and every H3N2 result to date was produced with concat. Declaring it keeps the
  # run reproducible from the bundle alone (same reasoning as flu_ha_na_cc_nt_cds_cm0).
  interaction: concat
