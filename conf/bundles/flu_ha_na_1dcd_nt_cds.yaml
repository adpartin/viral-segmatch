# STATUS: production -- 1D cluster-disjoint CV holding out HA's clusters; HA paired with NA.
# NA is segment 6, after HA's 4, so the canonical pair is (HA, NA) and HA sits in slot a.
# Base recipe for the six flu_ha_<partner>_1dcd_nt_cds bundles; sweep t and slot via --override.
# Guarded by tests/test_production_splits.py; plan docs/plans/2026-07-27_1d_cluster_disjoint_single_slot_plan.md.
#
# split_strategy is inline because Hydra rejects a `- /dataset/split_strategy: cluster_disjoint`
# group re-selection as a duplicate group choice under the `bundles` package.

# Inherits the 28-pair master directly rather than flu_ha_na, whose seq_disjoint settings would
# have to be overridden field by field (and leaked hash_key: seq into the resolved config).

defaults:
  - flu_28_major_protein_pairs_master
  - _self_

dataset:
  pair_builder_version: v2
  schema_pair:
    - "Hemagglutinin precursor"
    - "Neuraminidase protein"

  n_folds: 4                     # k=4: feasible for both slots across t099..t095 (pair-mass pre-flight)
  neg_to_pos_ratio: 1.0
  generate_visualizations: false # Stage-3 build only; features (kmer/esm) not built yet
  split_strategy:
    mode: cluster_disjoint
    cluster_alphabet: nt_cds
    pair_key_alphabet: nt_cds
    single_slot: a               # 'a' = hold out HA clusters; 'b' = hold out NA
    negative_scope: within_fold
    cluster_id_path: data/processed/flu/July_2025/clusters_nt_cds_cm0/t099/combined_cluster.parquet
    cluster_id_threshold: 0.99
    cds_final_path: data/processed/flu/July_2025/cds_dna_final.parquet
    feasibility:
      max_acceptable_drift_pp: 0.05
      min_test_frac: 0.05

kmer:
  alphabet: nt_cds
  k: 6

training:
  # concat matches the inherited master default; declared so the bundle states what it trains with.
  interaction: concat
  slot_transform: "unit_norm"   # L2-normalize each slot vector before the interaction

baselines:
  enabled: [lgbm]
