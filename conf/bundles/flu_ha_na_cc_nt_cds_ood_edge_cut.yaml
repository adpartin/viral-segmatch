# KEEP -- parent of flu_ha_na_cc_nt_cds_ood_leave_cc_out_vs_random; deleting it breaks that bundle.
#
# STATUS: experimental -- HA-NA 2D-CD CV on nt_cds OOD clusters at t095, with edge-cut
# fragmentation on: `_megacc_cut.fragment_until` spectrally bisects the largest component until
# the drop budget binds, growing the atom count from the natural 108 to ~124 for ~2% of pairs.
# Inherits flu_ha_na_cc_nt_cds_ood; disable with edge_cut.enabled=false for the 108-atom baseline.

defaults:
  - flu_ha_na_cc_nt_cds_ood
  - _self_

dataset:
  split_strategy:
    cluster_id_path: data/processed/flu/July_2025/clusters_nt_cds_ood/t095/combined_cluster.parquet
    edge_cut:
      enabled: true
      cut_method: spectral   # spectral (Fiedler) | kl (Kernighan-Lin)
      target_atoms: 124      # grow toward this many atoms
      max_drop_frac: 0.02    # cap on the dropped-pair fraction (best-effort; floor-limited)
