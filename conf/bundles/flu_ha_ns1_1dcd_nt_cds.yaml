# STATUS: experimental -- 1D cluster-disjoint CV holding out HA's clusters; HA paired with NS1.
# NS1 is segment 8, after HA's 4, so the canonical pair is (HA, NS1) and HA sits in slot a.
# Inherits flu_ha_na_1dcd_nt_cds (nt_cds/cm0, k=4, within_fold negatives); sweep t via --override.
defaults:
  - flu_ha_na_1dcd_nt_cds
  - _self_

dataset:
  schema_pair:
    - 'Hemagglutinin precursor'
    - 'Non-structural protein 1, interferon antagonist and host mRNA processing inhibitor'
  split_strategy:
    single_slot: a
