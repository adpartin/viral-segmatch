# STATUS: experimental -- 1D cluster-disjoint CV holding out HA's clusters; HA paired with PB1.
# PB1 is segment 2, before HA's 4, so the canonical pair is (PB1, HA) and HA sits in slot b.
# Inherits flu_ha_na_1dcd_nt_cds (nt_cds/cm0, k=4, within_fold negatives); sweep t via --override.
defaults:
  - flu_ha_na_1dcd_nt_cds
  - _self_

dataset:
  schema_pair:
    - 'Hemagglutinin precursor'
    - 'RNA-dependent RNA polymerase catalytic core PB1 subunit'
  split_strategy:
    single_slot: b
