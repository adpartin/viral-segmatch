# STATUS: experimental -- 1D cluster-disjoint CV holding out HA's clusters; HA paired with NP.
# NP is segment 5, after HA's 4, so the canonical pair is (HA, NP) and HA sits in slot a.
# Inherits flu_ha_na_1dcd_nt_cds (nt_cds/cm0, k=4, within_fold negatives); sweep t via --override.
defaults:
  - flu_ha_na_1dcd_nt_cds
  - _self_

dataset:
  schema_pair:
    - 'Hemagglutinin precursor'
    - 'Nucleocapsid protein'
  split_strategy:
    single_slot: a
