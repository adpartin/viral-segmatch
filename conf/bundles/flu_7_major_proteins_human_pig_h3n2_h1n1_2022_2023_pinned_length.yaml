# Population and pins for Task 2 of docs/plans/2026-10-08_paper_plan.md, section
# "The Task 2 population": [Human, Pig] x [H3N2, H1N1] x [2022, 2023]. All 8 metadata groups have
# isolates, 10,992 in total, from 4,864 in Human-H3N2-2022 down to 157 in Pig-H3N2-2022.
#
# The pair-capacity audit runs on this bundle on its own. A master bundle above it adds the
# positive selection, the feature settings and the matched negative profile.
#
# NS1 IS EXCLUDED, so this bundle carries 7 of the 8 major proteins. NS1 has two lengths in this
# population, 693 nt in Human-H3N2 and 660 nt in the other three host and subtype combinations,
# split 1,552 against 1,485 of 3,062 unique complete sequences. Neither reaches the 0.90 floor
# `check_cds_length` applies, so no single pin covers both. Narrowing `selected_functions` here
# means a run on this bundle never asks for a protein it cannot pin.
#
# PB1 is pinned at 2,274 nt, which `conf/virus/flu.yaml` does not carry because human H3N2 moved
# to 2,277 nt in 2024. The years above end at 2023 for that reason: over 2022-2023 all 8 groups
# have 2,274 nt as their own modal length and 0.912 of the population's unique complete PB1
# sequences sit there, while adding 2024 drops that share to 0.782. The override merges with the
# six pins in `conf/virus/flu.yaml` rather than replacing them.
#
# Measured on cds_dna_final: results/flu/July_2025/pair_capacity_task2_2x2x2/, under
# cds_length_survey_grid/ per group and cds_length_survey_candidates/ for the pooled population.
#
# Inherited and deliberately not restated here: require_complete_cds_at_pinned_length, the nt_cds
# pair key, a 1:1 negative ratio and the 4-fold random CV. Task 2 trains at 5 folds, set by the
# experiment spec's `dataset.n_folds=5` override rather than in this bundle, as Task 1 does.
defaults:
  - flu_ha_na_h3n2_2024_random_cv4_pinned_length
  - _self_

dataset:
  host: [Human, Pig]
  hn_subtype: [H3N2, H1N1]
  year: [2022, 2023]

virus:
  selected_functions:
    - 'RNA-dependent RNA polymerase PB2 subunit'                  # Seg. 1 (PB2)
    - 'RNA-dependent RNA polymerase catalytic core PB1 subunit'   # Seg. 2 (PB1)
    - 'RNA-dependent RNA polymerase PA subunit'                   # Seg. 3 (PA)
    - 'Hemagglutinin precursor'                                   # Seg. 4 (HA)
    - 'Nucleocapsid protein'                                      # Seg. 5 (NP)
    - 'Neuraminidase protein'                                     # Seg. 6 (NA)
    - 'Matrix protein 1'                                          # Seg. 7 (M1)

  cds_length:
    PB1: {nt: 2274, seq_frac: 0.912}   # 758 codons; measured on this population
