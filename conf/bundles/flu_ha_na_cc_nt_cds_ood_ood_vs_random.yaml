# STATUS: experimental -- HA-NA OOD-vs-random paired CV at t095 (leave-one-CC-out vs size-matched random).
# Builds BOTH arms from ONE fixed within-CC negative pool, differing only in how the same `full` pairs
# are partitioned: out_dir/ood/fold_k/ (each of the 3 largest fragmented CCs is the sole test fold once)
# and out_dir/random/fold_k/ (the 3-CC pairs shuffled into matched-size folds; tail CCs always train).
# See docs/plans/2026-07-21_ood_vs_random_split_plan.md.
#
# Inherits flu_ha_na_cc_nt_cds_ood_edge_cut (t095 + spectral edge-cut). Overrides:
#   - edge_cut.max_drop_frac 0.02 -> 0.10 and target_atoms -> unreachable, so the drop budget binds and
#     the mega-CC fragments into the 3 hub CCs (~26.6k/25.2k/20.6k pairs = 95.6%) the design targets.
#   - negative_scope within_fold -> within_cc + the _ood membership (reusable pool, cross-cluster in the
#     multi-cluster CC, within-cluster in the hub CCs).
#   - fold_assignment -> leave_cc_out, paired_random -> true, n_folds -> 3.
#
# Run:
#   python src/datasets/dataset_pairs_cc.py \
#       --config_bundle flu_ha_na_cc_nt_cds_ood_ood_vs_random --out_dir <out_dir>
# Measure the tail's effect: --override dataset.split_strategy.tail_ccs_to_train=false

defaults:
  - flu_ha_na_cc_nt_cds_ood_edge_cut
  - _self_

dataset:
  n_folds: 3
  split_strategy:
    negative_scope: within_cc
    m_pos_per_cc: null
    fold_assignment: leave_cc_out
    paired_random: true
    tail_ccs_to_train: true
    membership_path: data/processed/flu/July_2025/cluster_membership/cluster_memb_nt_cds_ood.parquet
    edge_cut:
      enabled: true
      cut_method: spectral
      target_atoms: 500      # unreachable at t095 (floor ~125) -> max_drop_frac binds
      max_drop_frac: 0.10    # reproduces the 3-hub fragmented structure (pre-step used 0.10)
