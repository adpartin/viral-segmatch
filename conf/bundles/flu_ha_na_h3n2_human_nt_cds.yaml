# STATUS: experimental -- within-stratum sequence-signal test (H3N2 / Human / 2010-2024).
# Fixes the demographic shortcut: host=Human and subtype=H3N2 are held CONSTANT, so the categorical
# metadata match is uninformative; the year SPANS 2010-2024 so real sequence diversity (antigenic
# drift / clades) remains. A sequence model must then discriminate co-occurrence from clade/temporal
# sequence structure alone. Random k-fold (in-distribution, lenient test). Built by
# dataset_segment_pairs.py; nt_cds pairs + k-mer k6. Compare k-mer LGBM vs metadata_fea_only_baseline.
defaults:
  - flu_ha_na
  - _self_

dataset:
  n_folds: 4
  neg_to_pos_ratio: 1.0
  generate_visualizations: false
  host: [Human]
  hn_subtype: [H3N2]
  year_range: [2010, 2024]
  split_strategy:
    mode: random
    pair_key_alphabet: nt_cds
    cds_final_path: data/processed/flu/July_2025/cds_dna_final.parquet

kmer:
  alphabet: nt_cds
  k: 6
