# H3N2 2024 PB2-PA population with complete, pinned-length CDS and the largest
# possible set of positives in which each PB2 and PA sequence occurs once.
defaults:
  - flu_ha_na_h3n2_2024_random_cv4_pinned_length
  - _self_

dataset:
  schema_pair:
    - 'RNA-dependent RNA polymerase PB2 subunit'
    - 'RNA-dependent RNA polymerase PA subunit'
  positive_pair_selection:
    method: hopcroft_karp

training:
  interaction: concat
