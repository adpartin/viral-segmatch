# STATUS: experimental -- HA/NA on H3N2, train on 2024 only and test on 2025.
# The one-year-ahead form of the temporal question ("predict the next season") that
# flu_ha_na_h3n2_nt_cds_temporal_2025 asks with a ten-year training window (2015-2024). Running
# both separates "can the model extrapolate one year" from "does it need a long history".
#
# Population and negatives match the random-CV year sweep (flu_ha_na_h3n2_{year}_random_cv4) so
# the temporal split can be read against the same-year random splits: H3N2, nt_cds pair_keys,
# LGBM on nt_cds k-mers, interaction concat.
#
# Sizes: 3,723 positive pairs in 2024 (train pool) and 2,663 in 2025 (test). 139 pair_keys occur
# in both years -- 5.2% of the 2025 universe. Global pair_key dedup keeps one representative
# isolate per key, so roughly half of those 139 are removed from test and half from train; on the
# 2015-2024 -> 2025 run the same effect cost the test split 63 of 2,663 positives (2.4%).
#
# Two constraints the v2 validator enforces (dataset_segment_pairs_v2.py:3178-3191): metadata_holdout
# is single-split only (n_folds must be null) and requires split_strategy.mode=random. So there is
# one split and no fold-to-fold variance here, unlike the 4-fold random-CV runs, and the split is
# NOT cluster-disjoint -- a 2025 sequence may share a cluster with a 2024 training sequence.
#
# `val: null` carves val out of the TRAIN year, so the LGBM operating threshold is selected on 2024
# and applied to 2025.
#
# `training.interaction: concat` is declared rather than inherited: flu_ha_na sets 'unit_diff + prod'
# (which flu_ha_na_h3n2_nt_cds_temporal_2025 picked up), while every H3N2 result in the year sweep
# used concat. Declaring it keeps this run comparable to the sweep and reproducible from the bundle.
defaults:
  - flu_ha_na
  - _self_

dataset:
  n_folds: null                 # required by the metadata_holdout dispatch
  neg_to_pos_ratio: 1.0
  generate_visualizations: false
  hn_subtype: [H3N2]            # population filter, applied before the holdout split
  metadata_holdout:
    train: {year: [2024]}
    test: {year: [2025]}
    val: null                   # carved from the train pool at val_ratio, seeded
  split_strategy:
    mode: random                # required by the metadata_holdout dispatch
    pair_key_alphabet: nt_cds
    cds_final_path: data/processed/flu/July_2025/cds_dna_final.parquet

kmer:
  alphabet: nt_cds
  k: 6

training:
  interaction: concat
