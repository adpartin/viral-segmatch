# Per-site codon features on the Human-H3N2-2024 Hopcroft-Karp selected-positive folds.
#
# Mirrors flu_ha_na_h3n2_2024_random_cv4_pinned_length_hopcroft_karp_site_codon on the
# host-filtered population. The four-pair experiment
# (docs/results/2026-09-08_h3n2_2024_progress_report.md) reached these settings through run-time
# overrides, so its recipe lived only in each run's resolved_config.yaml. Experiment 4 of
# docs/plans/2026-09-14_codon_site_features_plan.md compares 2024 against
# 2025, and both years have to be configured the same way from a bundle for that comparison to
# rest on something a reader can check.
defaults:
  - flu_ha_na_human_h3n2_2024_random_cv4_pinned_length_hopcroft_karp
  - _self_

site:
  unit: codon
  encoding: ordinal

training:
  feature_source: site
  interaction: concat
  slot_transform: none
