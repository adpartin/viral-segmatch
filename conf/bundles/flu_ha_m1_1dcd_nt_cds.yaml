# STATUS: experimental -- 1D cluster-disjoint CV holding out HA's clusters; HA paired with M1.
# M1 is segment 7, after HA's 4, so the canonical pair is (HA, M1) and HA sits in slot a.
# Inherits flu_ha_na_1dcd_nt_cds (nt_cds/cm0, k=4, within_fold negatives); sweep t via --override.
defaults:
  - flu_ha_na_1dcd_nt_cds
  - _self_

dataset:
  schema_pair:
    - 'Hemagglutinin precursor'
    - 'Matrix protein 1'
  split_strategy:
    single_slot: a
