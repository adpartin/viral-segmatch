# STATUS: experimental -- HA 1D cluster-disjoint (HA held out) paired with M1, nt_cds/cm0.
# M1 is on a later segment than HA (seg 4 < seg 7), so schema_pair stays (HA, M1):
# HA is slot a, so single_slot: a holds out HA's clusters. Base recipe: flu_ha_na_1dcd_nt_cds.
# t sweep (cluster_id_path / cluster_id_threshold) is set per-run via --override at build time.
defaults:
  - flu_ha_na_1dcd_nt_cds
  - _self_

dataset:
  schema_pair:
    - 'Hemagglutinin precursor'
    - 'Matrix protein 1'
  split_strategy:
    single_slot: a
