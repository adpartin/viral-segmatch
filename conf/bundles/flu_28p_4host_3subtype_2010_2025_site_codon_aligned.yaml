# Master bundle for the 28-pair per-site codon screen on Chicken, Duck, Human and Swine; H1N1,
# H3N2 and H5N1; 2010-2025, with codons placed in protein-alignment columns. Task 2 of
# docs/plans/2026-10-08_paper_plan.md; planned in docs/plans/2026-11-17_aligned_codon_features_plan.md.
#
# Build and train its children with the experiment spec
# conf/experiments/4host_3subtype_2010_2025_28p_codon_aligned_matched_cv5.yaml.
#
# Do NOT run this bundle directly: schema_pair is null and each child sets it. The children are
# named flu_28p_4host_aligned_codon_<pair>.
# Inheritance: flu_28p_human_h3n2_2024_site_codon_aligned -> this file -> children.
#
# This file sets the population, the metadata group minimum, the handling of unmatchable metadata
# groups and the LightGBM tree cap. Everything else comes from the
# Task 1 aligned master: the 8 proteins, the nt_cds pair key, Hopcroft-Karp positive selection,
# matched balanced-usage negatives with exact years, the alignment directories and the feature
# settings. The bundles keep the inherited 4-fold setting, and the experiment spec sets 5 folds.
# The population is the one the alignments in `site.alignment_dirs` were made from.

defaults:
  - flu_28p_human_h3n2_2024_site_codon_aligned
  - _self_

dataset:
  host: [Human, Swine, Chicken, Duck]
  hn_subtype: [H3N2, H1N1, H5N1]
  year: null
  year_range: [2010, 2025]
  # Matched negatives need at least 2 positives of each metadata group in every split of every
  # fold. With 5 folds, a group of 20 selected positives puts 4 in each test fold and about 2 of
  # the other 16 in validation. Groups with fewer are dropped before the folds are made and
  # listed in metadata_groups_dropped.json.
  min_metadata_group_positives: 20
  # A group can hold 20 selected positives and still have no valid matched negative assignment in
  # one split, which happens where a split holds 2 of its positives and the only assignment left
  # reproduces an observed pair. Such a group is removed from every fold and split instead of
  # stopping the build, and is listed in metadata_groups_infeasible.json.
  on_infeasible_metadata_group: drop_group

baseline_lgbm:
  # The tree cap. Early stopping on validation AUC-ROC is meant to set the tree count. The five
  # PB1-HA fits on this population with the 1,000-tree default selected round 993 or 1,000, so
  # there the cap set it.
  n_estimators: 5000
