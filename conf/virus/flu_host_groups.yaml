# Host groups, for selecting a population and for reporting results per group.
#
# Maps every `host` value in data/processed/flu/metadata_eda/flu_genomes_metadata_parsed.csv
# to one group. `host` holds the curated `host_common_name` field after the fixes in
# HOST_NORMALIZATION (src/preprocess/flu_genomes_eda.py), so the names below are spelled
# the way that file writes them.
#
# Names are listed in full rather than matched by a pattern. A pattern quietly moves
# isolates to another group when a new name arrives, and a short pattern catches the wrong
# animal, because "pig" sits inside "Pigeon" and "Guinea" names a bird, not a country.
#
# Two states sit outside these groups. An isolate with no host name has no group either.
# A host name that no group lists is reported as Unmapped, with a warning, so a new name
# is noticed instead of guessed. Neither is a group here, because neither says the host
# is anything in particular.
#
# Every name belongs to exactly one group; the loader checks this.
# Measured on the July_2025 corpus, 2026-11-08: 274 names, 110,205 isolates with a host name, 1,592 without one.

host_groups:
  # The only human name in the curated field.
  # 1 name(s), 58,475 isolates.
  Human:
    - 'Human'

  # Wildboar is not here: it has no curated host_common_name, so it never
  # reaches `host`.
  # 1 name(s), 11,784 isolates.
  Swine:
    - 'Pig'

  # Farmed birds.
  # 3 name(s), 8,257 isolates.
  Chicken:
    - 'Chicken'
    - 'Silky Chicken'
    - 'Wild Chicken'

  # Every true duck, farmed or wild. Geese, swans and turkeys are close relatives
  # but are not ducks, so they are in Other Bird. The Farmed / Wild / Not sure note
  # on each line is read off the species, because no field in the record says which;
  # it is there to show that this group mixes the two. Almost every isolate here is
